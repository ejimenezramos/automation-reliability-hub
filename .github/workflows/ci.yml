name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  checks:
    name: Build, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
          run_install: false
          cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm build

      - name: Lint frontend
        run: pnpm lint
      - name: Restore API dependencies
        run: dotnet restore apps/api/Hub.Api.csproj

      - name: Build API
        run: dotnet build apps/api/Hub.Api.csproj --configuration Release --no-restore
      - name: Restore API test dependencies
        run: dotnet restore tests/Hub.Api.IntegrationTests/Hub.Api.IntegrationTests.csproj

      - name: Run API integration tests
        run: dotnet test tests/Hub.Api.IntegrationTests/Hub.Api.IntegrationTests.csproj --configuration Release --no-restore
